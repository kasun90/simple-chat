services:
  chat:
    build: .
    image: simple-chat:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /app/data/chat.db
      SEED_USERS: alice,bob
    volumes:
      - chat-data:/app/data
    healthcheck:
      # distroless has no curl/wget; the binary exposes a self-check subcommand.
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  chat-data:
